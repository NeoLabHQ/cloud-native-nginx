# Main Nginx Configuration Template
# Variables: ${BACKEND}, ${PORT}

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

load_module modules/ngx_http_modsecurity_module.so;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Hide nginx version
    server_tokens off;

    # Logging - JSON format for efficient parsing
    log_format json escape=json '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"x_forwarded_for":"$http_x_forwarded_for",'
        '"request":"$request",'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"http_referer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time"'
    '}';

    access_log /var/log/nginx/access.log json;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml application/rss+xml application/atom+xml image/svg+xml;

    # ===== RATE LIMITING ZONES =====

    # OTP verification (strictest - 3 req/min)
    limit_req_zone $binary_remote_addr zone=otp:10m rate=3r/m;

    # Login endpoints (5 req/min)
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

    # General API (100 req/min)
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/m;

    # Heavy endpoints (10 req/min)
    limit_req_zone $binary_remote_addr zone=heavy:10m rate=10r/m;

    # Connection limit
    limit_conn_zone $binary_remote_addr zone=conn:10m;

    # ===== DOS PROTECTION =====

    client_max_body_size 10m;
    client_body_buffer_size 128k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 10s;
    large_client_header_buffers 4 8k;

    # ===== UPSTREAM =====

    upstream backend {
        server ${BACKEND};
        keepalive 32;
    }

    # ===== METRICS SERVER (internal only) =====

    server {
        listen 8080;
        server_name _;

        # Nginx stub_status for prometheus exporter
        location /stub_status {
            stub_status;
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
        }

        # Health check
        location /healthz {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }
    }

    # ===== HTTP SERVER (redirect to HTTPS or serve directly) =====

    server {
        listen 80;
        server_name _;

        # Health check endpoint (no redirect)
        location /healthz {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # ===== SECURITY HEADERS (for HTTP) =====
        include /etc/nginx/includes/security-headers.conf;

        # ===== MODSECURITY =====
        modsecurity on;
        modsecurity_rules_file /etc/modsecurity.d/include.conf;

        # ===== CONNECTION LIMITS =====
        limit_conn conn 100;

        # ===== PATH PROTECTION =====

        # Disable directory listing
        autoindex off;

        # Block hidden files
        location ~ /\. {
            deny all;
            return 404;
        }

        # Block backup files
        location ~* \.(bak|backup|old|orig|save|swp|tmp)$ {
            deny all;
            return 404;
        }

        # Block config files
        location ~* (package\.json|package-lock\.json|\.env|tsconfig\.json|composer\.json)$ {
            deny all;
            return 404;
        }

        # Block path traversal
        location ~* (\.\./|\.\.) {
            deny all;
            return 403;
        }

        # Block sensitive directories
        location ~ ^/(node_modules|src|prisma|docker|scripts)/ {
            deny all;
            return 404;
        }

        # ===== RATE LIMITED ENDPOINTS =====

        # OTP verification (strictest)
        location /api/auth/verify-otp {
            limit_req zone=otp burst=2 nodelay;
            limit_req_status 429;

            proxy_pass http://backend;
            include /etc/nginx/includes/proxy-headers.conf;
        }

        # OTP sending
        location /api/auth/send-otp {
            limit_req zone=otp burst=2 nodelay;
            limit_req_status 429;

            proxy_pass http://backend;
            include /etc/nginx/includes/proxy-headers.conf;
        }

        # Login endpoints
        location ~ ^/api/auth/(login|admin/login) {
            limit_req zone=login burst=3 nodelay;
            limit_req_status 429;

            proxy_pass http://backend;
            include /etc/nginx/includes/proxy-headers.conf;
        }

        # Heavy endpoints
        location ~ ^/api/(export|reports) {
            limit_req zone=heavy burst=5 nodelay;
            limit_req_status 429;

            proxy_pass http://backend;
            include /etc/nginx/includes/proxy-headers.conf;
        }

        # General API
        location /api/ {
            limit_req zone=api burst=50 nodelay;

            proxy_pass http://backend;
            include /etc/nginx/includes/proxy-headers.conf;
        }

        # GraphQL endpoint
        location /graphql {
            limit_req zone=api burst=50 nodelay;

            proxy_pass http://backend;
            include /etc/nginx/includes/proxy-headers.conf;
        }

        # Default location
        location / {
            proxy_pass http://backend;
            include /etc/nginx/includes/proxy-headers.conf;
        }

        # Custom 429 response
        error_page 429 = @rate_limited;
        location @rate_limited {
            default_type application/json;
            return 429 '{"error": "Too Many Requests", "message": "Rate limit exceeded. Please try again later.", "retry_after": 60}';
        }
    }

    # ===== HTTPS SERVER (optional - enable when certs are available) =====

    # Uncomment this block when you have SSL certificates
    # server {
    #     listen 443 ssl http2;
    #     server_name _;
    #
    #     # SSL Configuration
    #     ssl_certificate /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
    #     ssl_prefer_server_ciphers on;
    #     ssl_session_cache shared:SSL:10m;
    #     ssl_session_timeout 1d;
    #     ssl_session_tickets off;
    #
    #     # Include the same location blocks as HTTP server above
    #     # ...
    # }
}
