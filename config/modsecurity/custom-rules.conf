# Custom ModSecurity Rules
# File: RESPONSE-999-CUSTOM.conf
#
# These rules complement OWASP CRS. They are more targeted to avoid false positives.
# OWASP CRS already handles most attack patterns - these add application-specific protection.

# ===== SQL INJECTION (Advanced Patterns) =====

SecRule ARGS "@rx (?i)(union\s+select|drop\s+table|insert\s+into|delete\s+from|update\s+.*\s+set)" \
    "id:9900001,phase:2,deny,status:403,log,msg:'SQL Injection Detected',tag:'OWASP_CRS',tag:'attack-sqli',severity:'CRITICAL'"

# ===== COMMAND INJECTION (Targeted) =====

# NOTE: Rule 200002 removed - was blocking legitimate characters like () in phone numbers
# OWASP CRS rules 932xxx handle command injection comprehensively

SecRule ARGS "@rx (?i)(?:^|[;&|])\s*(?:cat|rm|wget|curl|bash|sh|nc|python|perl|ruby|php)\s+[^&|;]*(?:/|\.\.)" \
    "id:9900003,phase:2,deny,status:403,log,msg:'Dangerous Command Detected',tag:'OWASP_CRS',tag:'attack-rce',severity:'CRITICAL'"

# ===== XSS (Targeted) =====

SecRule ARGS "@rx (?i)<script[^>]*>|javascript:\s*[a-z]|on(?:error|load|click|mouse\w+|key\w+)\s*=" \
    "id:9900005,phase:2,deny,status:403,log,msg:'XSS Detected',tag:'OWASP_CRS',tag:'attack-xss',severity:'CRITICAL'"

# ===== PATH TRAVERSAL =====

SecRule REQUEST_URI|ARGS "@rx (?i)(?:\.\.\/|\.\.\\\\)" \
    "id:9900006,phase:1,deny,status:403,log,msg:'Path Traversal Detected',tag:'OWASP_CRS',tag:'attack-lfi',severity:'CRITICAL'"

SecRule REQUEST_URI|ARGS "@rx (?i)(?:%2e%2e%2f|%2e%2e\/|\.%2e%2f|%2e\.%2f)" \
    "id:9900007,phase:1,deny,status:403,log,msg:'URL Encoded Path Traversal',tag:'OWASP_CRS',tag:'attack-lfi',severity:'CRITICAL'"

SecRule REQUEST_URI|ARGS "@rx (?i)%252e%252e%252f" \
    "id:9900008,phase:1,deny,status:403,log,msg:'Double Encoded Path Traversal',tag:'OWASP_CRS',tag:'attack-lfi',severity:'CRITICAL'"

# ===== SENSITIVE FILE ACCESS =====

SecRule REQUEST_URI "@rx (?i)(?:/\.env|/\.git|/\.htaccess|/\.ssh|/\.bash|/wp-config\.php|/config\.php)" \
    "id:9900009,phase:1,deny,status:403,log,msg:'Sensitive File Access Attempt',tag:'OWASP_CRS',tag:'attack-disclosure',severity:'CRITICAL'"

SecRule REQUEST_URI|ARGS "@rx (?i)(?:/etc/passwd|/etc/shadow|/proc/self|/var/log/)" \
    "id:9900010,phase:1,deny,status:403,log,msg:'System File Access Attempt',tag:'OWASP_CRS',tag:'attack-lfi',severity:'CRITICAL'"

# ===== NULL BYTE INJECTION =====

SecRule REQUEST_URI|ARGS "@rx %00" \
    "id:9900011,phase:1,deny,status:403,log,msg:'Null Byte Injection',tag:'OWASP_CRS',tag:'attack-protocol',severity:'CRITICAL'"

# ===== SCANNER DETECTION =====

SecRule REQUEST_HEADERS:User-Agent "@rx (?i)(?:nikto|sqlmap|nmap|masscan|burpsuite|acunetix|nessus|qualys|w3af)" \
    "id:9900012,phase:1,deny,status:403,log,msg:'Security Scanner Detected',tag:'automation/scanner',severity:'WARNING'"

# ===== SSRF PROTECTION =====

# Block access to internal/private IP addresses via URL parameters
SecRule ARGS "@rx (?i)(?:https?://)?(?:localhost|127\.0\.0\.1|0\.0\.0\.0|169\.254\.\d+\.\d+|192\.168\.\d+\.\d+|10\.\d+\.\d+\.\d+|172\.(?:1[6-9]|2\d|3[01])\.\d+\.\d+)(?::\d+)?(?:/|$)" \
    "id:9900013,phase:2,deny,status:403,log,msg:'SSRF Attempt Detected',tag:'OWASP_CRS',tag:'attack-ssrf',severity:'CRITICAL'"

# Block cloud provider metadata endpoints
SecRule ARGS "@rx (?i)(?:https?://)?(?:metadata\.google|169\.254\.169\.254|metadata\.azure|169\.254\.170\.2)" \
    "id:9900014,phase:2,deny,status:403,log,msg:'Cloud Metadata SSRF Attempt',tag:'OWASP_CRS',tag:'attack-ssrf',severity:'CRITICAL'"

# ===== HTTP METHOD RESTRICTION =====

# Only allow common HTTP methods (GET, POST, PUT, PATCH, DELETE, OPTIONS, HEAD)
SecRule REQUEST_METHOD "!@within GET POST PUT PATCH DELETE OPTIONS HEAD" \
    "id:9900015,phase:1,deny,status:405,log,msg:'Invalid HTTP Method',tag:'attack-protocol',severity:'WARNING'"

