# ModSecurity Rule Exclusions
# File: REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf
#
# Add rule exclusions here to prevent false positives.
# This file is loaded BEFORE OWASP CRS rules.

# ===== REMOVED PROBLEMATIC RULES =====
#
# Rule 200002 - Removed from custom-rules.conf
# Pattern [;|`$()] was too broad - blocked:
#   - Phone numbers with parentheses: (123)456-7890
#   - JavaScript/JSON payloads
#   - Mathematical expressions: 2*(3+4)
#   - URLs with query parameters
#
# Rule 200004 - Removed from custom-rules.conf
# Pattern [\*\(\)\\] was too broad - blocked:
#   - Wildcard search: test*
#   - Phone numbers: (123)456-7890
#   - Windows file paths with backslashes

# ===== PARANOIA & ANOMALY SETTINGS =====
# Configured via environment variables in docker-compose.yml:
# - PARANOIA (default: 1)
# - ANOMALY_INBOUND (default: 5)
# - ANOMALY_OUTBOUND (default: 4)

# ===== COMMON FALSE POSITIVE EXCLUSIONS =====

# Exclude health check endpoint from logging
SecRule REQUEST_URI "@streq /healthz" \
    "id:900100,phase:1,pass,nolog,ctl:ruleEngine=Off"

# Exclude metrics endpoint from WAF
SecRule REQUEST_URI "@streq /stub_status" \
    "id:900101,phase:1,pass,nolog,ctl:ruleEngine=Off"

# ===== API-SPECIFIC EXCLUSIONS =====

# Allow JSON content type without issues
# Some CRS rules may flag JSON payloads incorrectly

# Example: Exclude specific rule for upload endpoint
# SecRule REQUEST_URI "@beginsWith /api/upload" \
#     "id:900200,phase:1,pass,nolog,ctl:ruleRemoveById=942100"

# Example: Exclude specific rule for search endpoint (if wildcards cause issues)
# SecRule REQUEST_URI "@beginsWith /api/search" \
#     "id:900201,phase:1,pass,nolog,ctl:ruleRemoveById=942200"

# ===== GRAPHQL EXCLUSIONS =====
# GraphQL queries can sometimes trigger SQL injection rules

# SecRule REQUEST_URI "@streq /graphql" \
#     "id:900300,phase:1,pass,nolog,ctl:ruleRemoveTargetById=942100;ARGS:query"

# ===== FILE UPLOAD EXCLUSIONS =====
# Large file uploads may need body inspection disabled

# SecRule REQUEST_URI "@beginsWith /api/files/upload" \
#     "id:900400,phase:1,pass,nolog,ctl:requestBodyAccess=Off"

# ===== HOW TO ADD EXCLUSIONS =====
#
# 1. Check ModSecurity audit log for blocked rule ID:
#    docker exec nginx-waf cat /var/log/modsecurity/audit.log | jq '.transaction.messages'
#
# 2. Add exclusion by rule ID:
#    SecRuleRemoveById 942100
#
# 3. Add exclusion for specific URI:
#    SecRule REQUEST_URI "@beginsWith /api/safe-endpoint" \
#        "id:900XXX,phase:1,pass,nolog,ctl:ruleRemoveById=942100"
#
# 4. Add exclusion for specific parameter:
#    SecRuleRemoveTargetById 942100 "ARGS:search_query"
