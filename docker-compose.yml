version: "3.8"

services:
  # ===========================================
  # NGINX + ModSecurity WAF
  # ===========================================
  nginx-waf:
    image: owasp/modsecurity-crs:4.8.0-nginx-alpine-202411100904
    container_name: nginx-waf
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    environment:
      # Backend configuration
      - BACKEND=${BACKEND:-app:3000}
      - PORT=80

      # ModSecurity settings
      - MODSEC_RULE_ENGINE=${MODSEC_RULE_ENGINE:-On}
      - MODSEC_AUDIT_LOG=/var/log/modsecurity/audit.log
      - MODSEC_AUDIT_LOG_FORMAT=JSON

      # OWASP CRS settings
      - PARANOIA=${PARANOIA:-1}
      - ANOMALY_INBOUND=${ANOMALY_INBOUND:-5}
      - ANOMALY_OUTBOUND=${ANOMALY_OUTBOUND:-4}

      # Proxy timeout
      - PROXY_TIMEOUT=60

    volumes:
      # Custom Nginx configuration
      - ./config/nginx/nginx.conf:/etc/nginx/templates/nginx.conf.template:ro
      - ./config/nginx/security-headers.conf:/etc/nginx/includes/security-headers.conf:ro
      - ./config/nginx/proxy-headers.conf:/etc/nginx/includes/proxy-headers.conf:ro

      # Custom ModSecurity rules
      - ./config/modsecurity/custom-rules.conf:/etc/modsecurity.d/owasp-crs/rules/RESPONSE-999-CUSTOM.conf:ro
      - ./config/modsecurity/exclusions.conf:/etc/modsecurity.d/owasp-crs/rules/REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf:ro

      # SSL certificates (mount your certs here)
      - ./certs:/etc/nginx/certs:ro

      # Logs
      - ./logs/nginx:/var/log/nginx
      - ./logs/modsecurity:/var/log/modsecurity

    networks:
      - security-net
    depends_on:
      - crowdsec
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===========================================
  # CrowdSec - Intrusion Prevention System
  # ===========================================
  crowdsec:
    image: crowdsecurity/crowdsec:v1.6.4
    container_name: crowdsec
    environment:
      - COLLECTIONS=crowdsecurity/nginx crowdsecurity/http-cve crowdsecurity/base-http-scenarios
      - GID=${GID:-1000}
    ports:
      - "${CROWDSEC_METRICS_PORT:-6060}:6060"
    volumes:
      # CrowdSec configuration
      - ./config/crowdsec:/etc/crowdsec:rw
      - crowdsec-data:/var/lib/crowdsec/data

      # Log sources to analyze
      - ./logs/nginx:/var/log/nginx:ro
      - ./logs/modsecurity:/var/log/modsecurity:ro

    networks:
      - security-net
    restart: unless-stopped

  # ===========================================
  # CrowdSec Bouncer for Nginx
  # ===========================================
  crowdsec-bouncer:
    image: crowdsecurity/nginx-bouncer:1.0.3
    container_name: crowdsec-bouncer
    environment:
      - CROWDSEC_LAPI_URL=http://crowdsec:8080
      - CROWDSEC_LAPI_KEY=${CROWDSEC_BOUNCER_KEY:-}
    volumes:
      - ./config/crowdsec-bouncer:/etc/crowdsec/bouncers:rw
    networks:
      - security-net
    depends_on:
      - crowdsec
    restart: unless-stopped

  # ===========================================
  # Nginx Prometheus Exporter (for CloudBankin)
  # ===========================================
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.3.0
    container_name: nginx-exporter
    command:
      - -nginx.scrape-uri=http://nginx-waf:8080/stub_status
    ports:
      - "${NGINX_EXPORTER_PORT:-9113}:9113"
    networks:
      - security-net
    depends_on:
      - nginx-waf
    restart: unless-stopped

  # ===========================================
  # Loki - Log Aggregation (Optional)
  # ===========================================
  loki:
    image: grafana/loki:3.3.2
    container_name: loki
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - ./config/loki:/etc/loki:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/loki-config.yml
    networks:
      - security-net
    restart: unless-stopped
    profiles:
      - monitoring

  # ===========================================
  # Promtail - Log Collector (Optional)
  # ===========================================
  promtail:
    image: grafana/promtail:3.3.2
    container_name: promtail
    volumes:
      - ./config/promtail:/etc/promtail:ro
      - ./logs:/var/log/app:ro
    command: -config.file=/etc/promtail/promtail-config.yml
    networks:
      - security-net
    depends_on:
      - loki
    restart: unless-stopped
    profiles:
      - monitoring

  # ===========================================
  # Grafana - Visualization (Optional)
  # ===========================================
  grafana:
    image: grafana/grafana:11.4.0
    container_name: grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - security-net
    depends_on:
      - loki
    restart: unless-stopped
    profiles:
      - monitoring

networks:
  security-net:
    driver: bridge

volumes:
  crowdsec-data:
  loki-data:
  grafana-data:
